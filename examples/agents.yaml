version: 1

server:
  listen: "127.0.0.1:8080"
  base_url: "http://127.0.0.1:8080"
  auth:
    mode: none
    tokens: []
  # Optional per-(caller, agent) token-bucket rate limit (0 disables).
  # rate_limit: { per_minute: 120, burst: 20 }
  # Persist tasks (durable interaction) and CLI session ids across restarts.
  # task_store_file: "/var/lib/harbor/tasks.json"
  # session_store_dir: "/var/lib/harbor/sessions"

# Optional OpenTelemetry export (OTLP/gRPC): traces and metrics. Empty endpoint
# disables it.
# telemetry:
#   endpoint: "localhost:4317"
#   insecure: true
#   service_name: "harbor"

# Optional runtime adapter plugins (Go .so, each exporting Register()).
# plugins: ["/opt/harbor/plugins/my-cli.so"]

sandbox:
  # workdir_root is required to confine tasks to a directory tree; the directory
  # must already exist. Left unset, tasks run in Harbor's working directory.
  # workdir_root: "/srv/workspaces"
  allow_outside: false
  inherit_env: true
  # Optional strong isolation: run each CLI inside a container. The task working
  # directory (and cli_home, when set) are bind-mounted at their host paths.
  # The image must provide the CLI; network defaults to none.
  # container: { image: "harbor/claude:latest", network: none, runtime: docker }
  # require_container_for_dangerous: true   # refuse allow_dangerous without a container
  # file_artifacts: true                    # emit a FilePart per changed file
  # raw_stream_dir: "/var/log/harbor/raw"   # write raw CLI stdout/stderr per task
  # raw_stream_compress: true

agents:
  - id: codebuddy
    display_name: "CodeBuddy"
    binary: codebuddy
    integration: stream-json
    args: ["-p", "--input-format", "stream-json", "--output-format", "stream-json", "--include-partial-messages"]
    session: { id_flag: "--session-id", resume_flag: "--resume", continue_flag: "-c" }
    limits: { max_concurrent: 3, timeout: 30m, breaker: { threshold: 3, cooldown: 30s, max_cooldown: 10m } }
    # Optional agent-card overrides. `description` replaces the card text.
    # `skills` advertises capabilities to callers (each needs id/name/description,
    # tags optional); when omitted, no skills are advertised.
    description: "CodeBuddy is a helpful software-development assistant that can write, review, and fix code in your repository."

  - id: opencode
    display_name: "OpenCode"
    binary: opencode
    integration: exec
    args: ["run", "{{.Prompt}}", "-m", "{{.Model}}"]
    session: { id_flag: "--session", continue_flag: "--continue" }
    limits: { max_concurrent: 2 }
    description: "OpenCode is a helpful software-development assistant for reading, searching, and explaining a codebase."

  - id: codex
    display_name: "Codex"
    binary: codex
    integration: exec
    args: ["exec", "--json", "--skip-git-repo-check", "{{.Prompt}}"]
    # Images are passed as arguments; input_image declares the accepted types.
    # image_args/top-level input_image default from the codex profile.
    limits: { max_concurrent: 2 }
    description: "Codex is a helpful software-development assistant that implements code changes and returns the diff."
    # Optional A2A gRPC binding for this agent (host:port).
    # grpc_listen: "127.0.0.1:50051"

  # Zero-code custom CLI (template): point `binary` at your own executable, then
  # uncomment. Unknown binaries need an explicit `integration` (and a `parser`
  # for the exec mode). The binary below does not exist, so it stays disabled.
  # - id: my-coder
  #   display_name: "My Coder"
  #   binary: my-coder
  #   integration: exec
  #   parser: regex
  #   regex: { text: '^OUT:\s*(.+)$' }
  #   args: ["--prompt", "{{.Prompt}}"]
  #   limits: { max_concurrent: 2 }

