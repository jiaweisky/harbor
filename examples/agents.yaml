version: 1

server:
  listen: "127.0.0.1:8080"
  base_url: "http://127.0.0.1:8080"
  auth:
    mode: none
    tokens: []

sandbox:
  # workdir_root is required to confine tasks to a directory tree; the directory
  # must already exist. Left unset, tasks run in Harbor's working directory.
  # workdir_root: "/srv/workspaces"
  allow_outside: false
  inherit_env: true

agents:
  - id: codebuddy
    display_name: "CodeBuddy"
    binary: codebuddy
    integration: stream-json
    args: ["-p", "--input-format", "stream-json", "--output-format", "stream-json", "--include-partial-messages"]
    session: { id_flag: "--session-id", resume_flag: "--resume", continue_flag: "-c" }
    limits: { max_concurrent: 3 }

  - id: opencode
    display_name: "OpenCode"
    binary: opencode
    integration: exec
    args: ["run", "{{.Prompt}}", "-m", "{{.Model}}"]
    session: { id_flag: "--session", continue_flag: "--continue" }
    limits: { max_concurrent: 2 }

