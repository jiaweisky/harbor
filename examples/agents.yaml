# Harbor agent configuration.
# Full reference: see the "Configuration" section of README.md.
#
# Environment references are expanded before YAML parsing, comments included.
# A reference must resolve unless it has a non-empty literal default, and a
# variable inside a default is not expanded. Quote scalars that contain
# references and single-quote Windows paths.
version: 1

server:
  listen: "127.0.0.1:8080"            # bind address
  base_url: "http://127.0.0.1:8080"   # externally reachable URL used in agent cards
  auth:
    mode: none                        # none | bearer (bearer protects the RPC/REST/gRPC endpoints)
    tokens: []
  # Optional per-(caller, agent) token-bucket rate limit (0 disables).
  # rate_limit: { per_minute: 120, burst: 20 }
  # Persist tasks and CLI session ids across restarts with SQLite. Without
  # `store: sqlite` everything is in-memory and lost on restart.
  # store: sqlite
  # store_path: "/var/lib/harbor/tasks.db"         # SQLite DB for tasks
  # session_store_dir: "/var/lib/harbor/sessions"   # per-agent <id>.db
  # Other server options:
  # agent_inactivity_timeout: 10m     # fail a task if the CLI is silent this long; 0 disables
  # allow_insecure: false             # a non-loopback bind with auth.mode=none refuses to start unless true
  # cors_allowed_origins: ["https://ops.example.com"]
  # push_allow_private_networks: false

# Optional OpenTelemetry export (OTLP/gRPC): traces and metrics. Empty endpoint
# disables it.
# telemetry:
#   endpoint: "localhost:4317"
#   insecure: true
#   service_name: "harbor"

# Optional runtime adapter plugins (Go .so, each exporting Register()).
# plugins: ["/opt/harbor/plugins/my-cli.so"]

sandbox:
  # Required: writable directory for the CLI process records used to clean up
  # orphans after a crash. Use a private per-user directory when several
  # instances or users share a host.
  state_dir: "/var/lib/harbor"
  inherit_env: true                  # false restricts the CLI env to an allowlist
  # Optional per-context isolation for concurrent tasks on the same project.
  # isolation: shared                # shared | worktree | copy | overlayfs
  # isolation_root: "/srv/iso"       # required for worktree/copy/overlayfs
  # copy_strategy: full              # copy only: full | cow
  # cli_home: "/srv/harbor-cli-home" # redirect the CLI config/home here
  # container: { image: "harbor/claude:latest", runtime: docker,
  #              extra_args: ["--network=none"] }   # flags are deployer-owned
  # require_container_for_dangerous: true   # refuse allow_dangerous without a container
  # raw_stream_dir: "/var/log/harbor/raw"   # write raw CLI stdout/stderr per task
  # raw_stream_compress: true

agents:
  # CodeBuddy restricted to read-only tools. `--allowedTools` pre-approves the
  # read-only tools; `--permission-mode dontAsk` denies every other tool without
  # prompting, so it reads/searches but cannot edit files or run commands. Tool
  # names are the CLI's own (see `codebuddy -h`); the CLI enforces it.
  - id: codebuddy
    binary: codebuddy
    integration: stream-json
    # interaction: auto | interactive | non-interactive   # whether CLI permission/plan prompts
    #                                                     # surface as A2A input-required (default: auto);
    #                                                     # keep the CLI from prompting (e.g. dontAsk below)
    #                                                     # when non-interactive
    workdir: "."   # required; "." is Harbor's working directory (stored absolute)
    # workdir: "/srv/projects/my-project"
    args:
      - "-p"
      - "--input-format"
      - "stream-json"
      - "--output-format"
      - "stream-json"
      - "--include-partial-messages"
      - "--permission-mode"
      - "dontAsk"
      - "--allowedTools"
      - "Read"
      - "Glob"
      - "Grep"
      - "WebFetch"
      - "WebSearch"
      - "LSP"
      - "ListMcpResources"
      - "ReadMcpResource"
    session: { id_flag: "--session-id", resume_flag: "--resume", continue_flag: "-c" }
    limits: { max_concurrent: 3, timeout: 30m, breaker: { threshold: 3, cooldown: 30s, max_cooldown: 10m } }
    card:
      name: "CodeBuddy"
      description: "CodeBuddy (read-only) answers questions about the Harbor project without modifying it."

  # OpenCode with no tool restrictions: any tool its agent mode allows is usable.
  - id: opencode
    binary: opencode
    integration: exec
    workdir: "."
    args: ["run", "{{.Prompt}}", "-m", "{{.Model}}"]   # exec passes the prompt via {{.Prompt}}
    session: { id_flag: "--session", continue_flag: "--continue" }
    limits: { max_concurrent: 2 }
    card:
      name: "OpenCode"
      description: "OpenCode assists with the Harbor project: reading, searching, explaining, and editing its code."

  # ---------------------------------------------------------------------------
  # Complete AgentCard example (commented out).
  #
  # Card configuration lives under `card:` and is separate from how Harbor runs
  # the CLI (binary/integration/args/workdir). The served card also contains
  # fields Harbor computes: supportedInterfaces, capabilities, defaultInputModes,
  # defaultOutputModes, and securitySchemes/securityRequirements (when
  # server.auth.mode is bearer). A2A protocolVersion is always 1.0.
  #
  # - id: card-example
  #   binary: codebuddy
  #   integration: exec
  #   args: ["-p", "{{.Prompt}}"]
  #   workdir: "."
  #   # cli_version: "2.1.292"   # optional CLI version override; skips probing
  #
  #   card:
  #     name: "Example Agent"
  #     description: "An example agent showing every configurable AgentCard field."
  #     version: "1.0.0"             # card version, not the A2A protocol version
  #     icon_url: "https://example.com/icon.png"
  #     documentation_url: "https://example.com/docs"
  #     provider:
  #       organization: "Example Org"
  #       url: "https://example.com"
  #
  #     # Skills are operator-authored; Harbor does not infer them from the CLI.
  #     skills:
  #       - id: code-review
  #         name: "Code review"
  #         description: "Review a code change for bugs, style, and quality issues."
  #         tags: ["review", "quality"]
  #         examples: ["Review the current diff."]
  #         input_modes: ["text/plain"]
  #         output_modes: ["text/plain", "application/json"]
  #
  #     # Additional protocol extensions declared on the card. A configured entry
  #     # with Harbor's interaction extension URI replaces the built-in declaration.
  #     extensions:
  #       - uri: "https://example.com/extensions/audit/v1"
  #         description: "Carries audit metadata on task messages."
  #         required: false
  #         params:
  #           retention_days: 30
  #
  #     # Optional JWS signing of the final card. key_file must be a PEM private
  #     # key (PKCS#8, EC, or PKCS#1); key_id is the JWS kid. algorithm is
  #     # inferred from the key when omitted.
  #     signing:
  #       key_file: "/etc/harbor/card-signing.pem"
  #       key_id: "harbor-2026-01"
  #       algorithm: "ES256"
  #       jwks_url: "https://example.com/.well-known/jwks.json"
